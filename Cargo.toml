[package]
name = "logsender"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight log sender agent"
license = "MIT"
repository = "https://github.com/juanparati/logsender"
keywords = ["logs", "opentelemetry", "datadog", "elasticsearch", "sender"]
categories = ["command-line-utilities"]

[[bin]]
name = "logsender"
path = "src/main.rs"

[lib]
name = "logsender"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
grok = { version = "2.4", default-features = false, features = ["pcre2"] }
serde_yaml_ng = "0.10"
url = "2"
hostname = "0.4"
colored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
opentelemetry = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "grpc-tonic", "http-proto", "reqwest-client", "tls-ring", "tls-webpki-roots", "gzip-tonic", "gzip-http"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
async-trait = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
