name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds with `cross` (Docker) for the musl targets, natively on macOS,
      # then uploads logsender-<target>.tar.gz to the GitHub release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: logsender
          target: ${{ matrix.target }}
          archive: logsender-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
