# Traditional syslog / journald short output (RFC 3164 style, no year).
#   Oct 27 10:00:01 web01 sshd[4242]: Accepted publickey for deploy from 10.0.0.9 port 51234 ssh2
name: syslog
description: syslog (RFC 3164) / journalctl text output

match:
  - '^%{SYSLOGTIMESTAMP:timestamp} %{SYSLOGHOST:host.name} %{PROG:process.name}(?:\[%{POSINT:process.pid}\])?: %{GREEDYDATA:message}$'

timestamp:
  format: '%b %d %H:%M:%S'
  assume_current_year: true

level:
  field: null
  default: INFO

multiline:
  mode: none
